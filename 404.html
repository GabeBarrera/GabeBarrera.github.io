<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#04040a;color:#c9f7ff;font-family:'Share Tech Mono',ui-monospace,monospace}
*{box-sizing:border-box}
a{color:#00f0ff;text-decoration:none}
a:hover{color:#ff2fb0}
::selection{background:#ff2fb0;color:#04040a}
@keyframes flick{0%,100%{opacity:.85}47%{opacity:.6}48%{opacity:1}52%{opacity:.7}}
</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(circle at 50% 35%,rgba(255,47,176,.16),transparent 55%),#05060e;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid rgba(255,47,176,.35)">
    <a href="index.dc.html" style="font-size:13px;letter-spacing:.24em;color:#ff2fb0">&#9664; RETURN TO TERMINAL</a>
    <div style="display:flex;gap:22px;font-size:13px;letter-spacing:.24em">
      <a href="index.dc.html#/projects">PROJECTS</a><a href="index.dc.html#/resume">RESUME</a><a href="index.dc.html#/about">ABOUT</a>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:70px 28px;text-align:center">
    <div style="font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(80px,20vw,220px);line-height:.9;color:#eafcff;text-shadow:0 0 40px rgba(255,47,176,.6),6px 0 0 rgba(0,240,255,.45),-6px 0 0 rgba(255,47,176,.45);animation:flick 3.4s steps(2) infinite">404</div>
    <div style="font-size:12px;letter-spacing:.4em;color:#39ff9a">SIGNAL LOST &#8212; ROUTE NOT FOUND</div>
    <div style="max-width:720px;border:1px solid rgba(0,240,255,.3);background:rgba(6,10,16,.75);padding:26px 28px">
      <div style="display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.22em;color:#5f8894;margin-bottom:14px">
        <span>GET {{ badPath }}</span><span>LOG {{ jokeNo }}/20</span>
      </div>
      <p style="margin:0;font-size:clamp(17px,2.6vw,24px);line-height:1.55;color:#c9f7ff;text-wrap:pretty">{{ joke }}</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center">
      <button type="button" onClick="{{ reroll }}" style="font-family:'Share Tech Mono',monospace;cursor:pointer;background:transparent;border:1px solid #00f0ff;color:#00f0ff;padding:11px 20px;font-size:13px;letter-spacing:.2em" style-hover="background:rgba(0,240,255,.14);box-shadow:0 0 22px rgba(0,240,255,.35)">NEXT EXCUSE &#8635;</button>
      <a href="index.dc.html" style="border:1px solid #39ff9a;color:#39ff9a;padding:11px 20px;font-size:13px;letter-spacing:.2em" style-hover="background:rgba(57,255,154,.14);box-shadow:0 0 22px rgba(57,255,154,.35)">BACK TO THE DESK</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const JOKES = [
  'This page pulled a zero-day on us \u2014 undisclosed, unpatched, unfindable.',
  'The page was here. Then someone ran rm -rf and called it "incident response".',
  'We hunted this URL across every log source. Zero results, high confidence.',
  'This route failed authentication with reality.',
  'Packet sent. Packet lost. Classic UDP energy.',
  'The page is in an air-gapped facility and refuses to route to you.',
  'Our threat model did not account for you typing that.',
  'DNS says it exists. DNS lies. DNS always lies.',
  'This link expired faster than a self-signed certificate.',
  'Somebody moved the page and forgot to file a change request.',
  'Suspected exfiltration: one (1) web page, destination unknown.',
  'The page is now a hash. We cannot reverse it and neither can you.',
  'Firewall rule 404: DENY ALL curiosity.',
  'Phishing test failed \u2014 you clicked a link that goes nowhere.',
  'This resource has been quarantined pending further analysis.',
  'You have discovered our least-privileged page: no content at all.',
  'The page took the Fifth. Legal advised silence.',
  'Ransomware note found: "your page is safe, our sense of humor is not".',
  'Honeypot engaged. There was never a page here \u2014 only vibes.',
  'Backup exists. Restore procedure documented in 2013. Nobody has tested it.'
];

class Component extends DCLogic {
  state = { joke: Math.floor(Math.random() * JOKES.length) };
  renderVals() {
    const from = new URLSearchParams(location.search).get('from');
    const hash = (location.hash || '').replace(/^#\/?/, '');
    return {
      joke: JOKES[this.state.joke],
      jokeNo: String(this.state.joke + 1).padStart(2, '0'),
      badPath: from || (hash ? '/' + hash : location.pathname || '/???'),
      reroll: () => this.setState(s => ({ joke: (s.joke + 1) % JOKES.length }))
    };
  }
}
</script>
</body>
</html>
