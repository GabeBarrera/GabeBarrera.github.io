<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wala Dito · 404</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Same paper, ink and sun as the main site; follows the visitor's saved day/night choice. */
:root{
  --paper:#f0e6cc; --ink:#24201b; --ink-soft:#544b3f; --ink-faint:#8c826f; --sun:#d63f29;
  --paper-rgb:240,230,204; --sky-top:240,230,204; --sky-hor:240,230,204; --scene-ink:36,32,27;
  --boat:#24201b; --streak:#f0e6cc;
  --font-name:"Orbitron","Eurostile","Bank Gothic","Arial Black",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  color-scheme:light;
}
html.night{
  --paper:#262a35; --ink:#efe6cf; --ink-soft:#cbc2ac; --ink-faint:#8f8b80; --sun:#e0583f;
  --paper-rgb:38,42,53; --sky-top:28,31,41; --sky-hor:47,52,66; --scene-ink:5,6,9;
  --boat:#08090c; --streak:#3a4050; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink-soft);
  font-family:var(--font-body);font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.38;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* navbar, identical to the site's */
.top{position:relative;z-index:5;background:linear-gradient(rgb(var(--sky-top)) 70%,rgba(var(--sky-top),0))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 22px}
.seal{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.seal-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:4px;background:var(--sun);color:var(--paper);
  box-shadow:inset 0 0 0 2px rgba(var(--paper-rgb),.35);transform:rotate(-3deg)}
.seal-mark svg{height:19px;width:auto;fill:currentColor;overflow:visible}
.seal-name{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:clamp(10px,2.4vw,30px);flex-wrap:wrap;justify-content:flex-end}
nav a{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink-faint);padding:6px 0;transition:color .4s}
nav a:hover{color:var(--ink)}

/* the scene */
.scene{position:relative;height:clamp(380px,62vh,620px);margin-top:-24px;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(to bottom,rgb(var(--sky-top)) 0%,rgb(var(--sky-hor)) 70%)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.code{position:absolute;left:0;right:0;top:12%;text-align:center}
.code h1{margin:0;font-family:var(--font-name);font-weight:600;color:var(--ink);font-size:clamp(84px,17vw,200px);line-height:1;letter-spacing:.04em}
.code h1 .ch{display:inline-block;text-align:center}
.code h1 .ch.off{color:var(--sun)}
.code p{margin:10px 0 0;font-family:var(--font-mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint)}
.code p b{color:var(--sun);font-weight:500}

/* boat: waterline (viewBox y=95) sits on the lake at 76% of the scene */
.boat{--bw:clamp(230px,30vw,400px);position:absolute;left:calc(50% - var(--bw) * .62);width:var(--bw);top:calc(76% - var(--bw) * .3167);color:var(--boat)}
.boat svg{display:block;width:100%;height:auto;overflow:visible}
.boat .drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4px) rotate(-.4deg)}to{transform:translateX(4px) rotate(.4deg)}}
/* the salakot, bobbing on its own a little way off */
.hat{--hw:clamp(46px,5.4vw,72px);position:absolute;left:calc(50% + var(--bw,30vw) * .5);width:var(--hw);top:calc(78% - var(--hw) * .5);color:var(--boat)}
.hat svg{display:block;width:100%;height:auto;overflow:visible}
.hat .bob{transform-origin:50% 60%;animation:bob 4.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(2px) rotate(4deg)}}
.hat .ring{fill:none;stroke:currentColor;stroke-width:.8;opacity:0;transform-origin:50% 50%;animation:ring 4.2s ease-out infinite}
.hat .ring:nth-of-type(2){animation-delay:1.4s}.hat .ring:nth-of-type(3){animation-delay:2.8s}
@keyframes ring{0%{opacity:.5;transform:scale(.35)}100%{opacity:0;transform:scale(1.25)}}

/* scene extras */
.boat .x{display:none}
.scene[data-v="sleep"] .x-sleep,.scene[data-v="fish"] .x-fish,.scene[data-v="capsized"] .x-capsized{display:inline}
.boat .z{opacity:0;animation:zz 3.6s ease-out infinite}
.boat .z:nth-of-type(2){animation-delay:1.2s}.boat .z:nth-of-type(3){animation-delay:2.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}25%{opacity:.85}100%{opacity:0;transform:translate(6px,-10px)}}
.boat .ring{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:ring 3.6s ease-out infinite}
.boat .ring:nth-of-type(2){animation-delay:1.8s}
.boat .bub{opacity:0;transform-box:fill-box;animation:bub 2.8s ease-in infinite}
.boat .bub:nth-of-type(2){animation-delay:.7s}.boat .bub:nth-of-type(3){animation-delay:1.4s}.boat .bub:nth-of-type(4){animation-delay:2.1s}
@keyframes bub{0%{opacity:0;transform:translateY(4px)}20%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.hat{display:none}
.scene[data-v="offline"] .hat,.scene[data-v="capsized"] .hat{display:block}
.scene[data-v="capsized"] .hat{left:calc(50% + var(--bw,30vw) * .62);top:calc(80% - var(--hw) * .5)}
.far{display:none;position:absolute;left:72%;top:calc(69.4% - 2.2vw * .73);width:clamp(30px,3.4vw,46px);color:var(--boat);opacity:.6}
.far svg{display:block;width:100%;height:auto}
.scene[data-v="sailed"] .far{display:block;animation:sail 40s linear infinite alternate}
@keyframes sail{from{transform:translateX(0)}to{transform:translateX(26px)}}

/* message + button */
main{flex:1}
.msg{text-align:center;padding-block:clamp(22px,4vw,40px) 64px}
.msg p{margin:0 auto;max-width:34ch;font-size:clamp(17px,1.7vw,20px);line-height:1.6;color:var(--ink)}
.home{display:inline-block;margin-top:28px;font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  text-decoration:none;background:var(--ink);color:var(--paper);border-radius:2px;padding:14px 26px;transition:background .3s}
.home:hover{background:var(--sun)}

@media (max-width:600px){
  .top .wrap{flex-direction:column;align-items:flex-start;gap:10px;padding-block:14px 16px}
  nav ul{justify-content:flex-start;gap:16px}
  nav a{font-size:11px;letter-spacing:.14em}
  .boat{left:calc(50% - var(--bw) * .66)}
  .hat{left:auto;right:6%}
}
@media (prefers-reduced-motion:reduce){ .boat .drift,.hat .bob,.hat .ring,.boat .z,.boat .ring,.boat .bub,.far{animation:none!important} .boat .z{opacity:.7} }
</style>
</head>

<main>

    <div class="boat" aria-hidden="true">

<script>
(function(){
"use strict";
var reduce=false; try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
function $(s){ return document.querySelector(s); }

/* ---------- five scenes, one picked at random (never the same one twice in a row) ---------- */
var SCENES=[
  {id:"offline",  text:"The boatman went offline mid-session. Only his salakot made it back up, and it isn't talking.", alt:"An empty bangka drifting on a misty lake, its laptop still on. The boatman's salakot floats nearby."},
  {id:"sleep",    text:"Request timed out. The boatman fell asleep waiting for this page to load.", alt:"The boatman asleep in his bangka, hat over his face, laptop closed, Zs drifting up."},
  {id:"fish",     text:"He's been fishing for this page all night. Not a single bite.", alt:"The boatman fishing off the bow of his bangka, his laptop glowing behind him."},
  {id:"capsized", text:"Capsized. Whatever lived at this address is at the bottom of the lake now.", alt:"A capsized bangka, only its keel above the water, bubbles rising and a salakot adrift."},
  {id:"sailed",   text:"That ship has sailed. Well, bangka. You missed this page by a few packets.", alt:"Only a mooring pole and a snapped rope remain; the bangka is a speck on the horizon."}
];
(function(){
  var last=-1; try{ last=parseInt(localStorage.getItem("bantay-404")||"-1",10); }catch(e){}
  var i=Math.floor(Math.random()*SCENES.length); if(i===last) i=(i+1+Math.floor(Math.random()*(SCENES.length-1)))%SCENES.length;
  try{ localStorage.setItem("bantay-404",String(i)); }catch(e){}
  var sc=SCENES[i], el=$(".scene");
  el.setAttribute("data-v",sc.id); el.setAttribute("aria-label",sc.alt);
  Array.prototype.forEach.call(document.querySelectorAll(".vuse"),function(u){ u.setAttribute("href","#v-"+sc.id); });
  $("#joke").textContent=sc.text;
  var hide = sc.id==="capsized" || sc.id==="sailed";
  $(".boat .contact").style.display = hide? "none":"";
})();

/* ---------- ink-wash landscape (same painter as the main site) ---------- */
function rng(seed){ return function(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
function ridge(rand,n,rough){ var p=new Array(n+1); p[0]=rand()*2-1; p[n]=rand()*2-1; var step=n,amp=1;
  while(step>1){ var h=step/2; for(var i=h;i<n;i+=step){ p[i]=(p[i-h]+p[i+h])/2+(rand()*2-1)*amp; } amp*=rough; step=h; } return p; }
var INK="36,32,27", K=1;
/* Philippine lowland jungle along a ridge: a dense canopy of overlapping rounded crowns,
   a few taller emergent trees, and scattered coconut palms leaning over it.
   Same overall height as the old pine row (about 8-24px on a 700px-tall scene). */
function drawJungle(ctx,W,H,o,yAt,n,A){
  var rand=rng(o.seed+7), u=H/700, x0=o.trees.from*W, x1=o.trees.to*W, span=x1-x0;
  var col="rgba("+INK+","+(A*.95)+")";
  function ridgeY(x){ return yAt(Math.max(0,Math.min(n,Math.round(x/W*n)))); }
  // only grow upward from the ridge: clip to the sky above the ridgeline
  ctx.save(); ctx.beginPath(); ctx.moveTo(0,0);
  for(var ci=0;ci<=n;ci++) ctx.lineTo(ci/n*W, yAt(ci)+.5);
  ctx.lineTo(W,0); ctx.closePath(); ctx.clip();
  // 1. canopy: crowns laid edge to edge so the forest reads as one dense mass
  ctx.beginPath();
  var x=x0;
  while(x<x1){
    var r=(3.2+rand()*4.2)*u, y=ridgeY(x)-r*.35;
    ctx.moveTo(x+r*1.25,y); ctx.ellipse(x,y,r*1.25,r,0,0,Math.PI*2);
    // a second, smaller crown tucked behind for depth
    if(rand()<.6){ var r2=r*(.6+rand()*.3), xo=x+(rand()-.5)*r*1.6, yo=y-r*.55; ctx.moveTo(xo+r2*1.2,yo); ctx.ellipse(xo,yo,r2*1.2,r2,0,0,Math.PI*2); }
    x+=r*(1.1+rand()*.6);
  }
  // 2. emergent trees: a trunk rising above the canopy with a broad, flat crown
  var em=Math.max(2,Math.round(o.trees.count/14));
  for(var e=0;e<em;e++){
    var ex=x0+span*(.05+rand()*.9), ey=ridgeY(ex), eh=(13+rand()*8)*u, cw=(5+rand()*3)*u;
    ctx.moveTo(ex-.7*u,ey); ctx.lineTo(ex-.5*u,ey-eh+cw*.3); ctx.lineTo(ex+.5*u,ey-eh+cw*.3); ctx.lineTo(ex+.7*u,ey); ctx.closePath();
    ctx.moveTo(ex+cw*1.3,ey-eh); ctx.ellipse(ex,ey-eh,cw*1.3,cw*.6,0,0,Math.PI*2);
    ctx.moveTo(ex+cw*.9-cw*.5,ey-eh-cw*.35); ctx.ellipse(ex-cw*.5,ey-eh-cw*.35,cw*.9,cw*.5,0,0,Math.PI*2);
  }
  ctx.fillStyle=col; ctx.fill();
  // 3. coconut palms: slim curved trunks, drooping fronds
  var palms=Math.max(3,Math.round(o.trees.count/7));
  ctx.strokeStyle=col; ctx.lineCap="round"; ctx.lineJoin="round";
  for(var p=0;p<palms;p++){
    var px=x0+span*(.03+rand()*.94), py=ridgeY(px)-1*u, ph=(15+rand()*9)*u, lean=(rand()-.5)*ph*.55;
    var tx=px+lean, ty=py-ph;
    ctx.beginPath(); ctx.lineWidth=Math.max(.8,1.25*u);
    ctx.moveTo(px,py); ctx.quadraticCurveTo(px+lean*.15,py-ph*.55,tx,ty); ctx.stroke();
    ctx.lineWidth=Math.max(.7,1.05*u); ctx.beginPath();
    var fronds=6+Math.floor(rand()*3);
    for(var f=0;f<fronds;f++){
      var ang=-Math.PI*.95+(Math.PI*.9)*(f/(fronds-1))+(rand()-.5)*.2, len=(6.5+rand()*3.5)*u;
      var ex2=tx+Math.cos(ang)*len, ey2=ty+Math.sin(ang)*len*.55+len*.45;   // tips droop below the crown
      var cx=tx+Math.cos(ang)*len*.55, cy=ty+Math.sin(ang)*len*.7-len*.18;
      ctx.moveTo(tx,ty); ctx.quadraticCurveTo(cx,cy,ex2,ey2);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(tx,ty+.6*u,1.2*u,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();   // coconuts
  }
  ctx.restore();
}
function layer(ctx,W,H,o){
  var A=Math.min(.95,o.alpha*K), rand=rng(o.seed), n=128, pts=ridge(rand,n,o.rough);
  function yAt(i){ var e=o.env?o.env(i/n):1; return o.base*H-(pts[i]*.5+.5)*o.amp*H*e; }
  ctx.beginPath(); ctx.moveTo(0,H); for(var i=0;i<=n;i++) ctx.lineTo(i/n*W,yAt(i)); ctx.lineTo(W,H); ctx.closePath();
  var g=ctx.createLinearGradient(0,(o.base-o.amp)*H,0,o.fadeTo*H);
  g.addColorStop(0,"rgba("+INK+","+A+")"); g.addColorStop(.55,"rgba("+INK+","+A*.55+")"); g.addColorStop(1,"rgba("+INK+",0)");
  ctx.fillStyle=g; ctx.fill();
  if(o.trees) drawJungle(ctx,W,H,o,yAt,n,A);
}
function soft(ctx,W,H,o,s){ var c=document.createElement("canvas"); c.width=Math.max(1,Math.round(W*s)); c.height=Math.max(1,Math.round(H*s));
  layer(c.getContext("2d"),c.width,c.height,o); ctx.drawImage(c,0,0,W,H); }
function paint(){
  var cv=$(".scene canvas"), r=cv.getBoundingClientRect(); if(!r.width) return;
  var dpr=Math.min(devicePixelRatio||1,2), W=Math.round(r.width*dpr), H=Math.round(r.height*dpr);
  cv.width=W; cv.height=H; var ctx=cv.getContext("2d");
  var cs=getComputedStyle(document.documentElement), night=document.documentElement.classList.contains("night");
  INK=cs.getPropertyValue("--scene-ink").trim()||INK; K=night?2.3:1;
  var hor=cs.getPropertyValue("--sky-hor").trim(), paper=cs.getPropertyValue("--paper-rgb").trim(), water=.70, narrow=r.width<600;
  soft(ctx,W,H,{seed:11,base:.50,amp:.22,rough:.56,alpha:.16,fadeTo:.66},.18);
  soft(ctx,W,H,{seed:29,base:.56,amp:.17,rough:.55,alpha:.24,fadeTo:.69},.3);
  soft(ctx,W,H,{seed:5,base:.63,amp:.13,rough:.5,alpha:.32,fadeTo:.71,env:function(t){return .35+.65*Math.pow(t,1.4);},trees:{count:narrow?28:70,from:.74,to:1}},.6);
  layer(ctx,W,H,{seed:3,base:.66,amp:.2,rough:.52,alpha:.78,fadeTo:.72,env:function(t){return Math.max(0,1-t*1.55);}});
  var m=ctx.createLinearGradient(0,(water-.09)*H,0,(water+.03)*H);
  m.addColorStop(0,"rgba("+hor+",0)"); m.addColorStop(.7,"rgba("+hor+",.92)"); m.addColorStop(1,"rgb("+hor+")");
  ctx.fillStyle=m; ctx.fillRect(0,(water-.09)*H,W,.12*H);
  var lk=ctx.createLinearGradient(0,(water+.03)*H,0,H); lk.addColorStop(0,"rgb("+hor+")"); lk.addColorStop(.55,"rgb("+paper+")"); lk.addColorStop(1,"rgb("+paper+")");
  ctx.fillStyle=lk; ctx.fillRect(0,(water+.03)*H,W,H);
  ctx.save(); ctx.globalAlpha=.1; ctx.translate(0,2*water*H); ctx.scale(1,-1);
  soft(ctx,W,H,{seed:3,base:.66,amp:.2,rough:.52,alpha:.9,fadeTo:.7,env:function(t){return Math.max(0,1-t*1.55);}},.25); ctx.restore();
  var R=rng(41); for(var k=0;k<26;k++){ var y=(water+.04+R()*.24)*H, x=R()*W, len=(30+R()*160)*dpr;
    ctx.strokeStyle= night? "rgba(255,244,214,"+(.03+R()*.05)+")" : "rgba("+INK+","+(.04+R()*.05)+")"; ctx.lineWidth=dpr;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke(); }
}
var rt; addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(paint,150); });

/* ---------- the laptop, still on: a terminal that keeps pinging, no one answering ---------- */
(function(){
  var g=document.getElementById("term"), NS="http://www.w3.org/2000/svg", LH=10.5, MAX=9, on=true;
  var C={red:"#e2553c",cream:"#f0e6cc",dim:"#8c826f"};
  // ping … no reply, over and over
  var script=[[4,C.red,14,C.cream,30,C.dim],[46,C.dim],[4,C.red,14,C.cream,30,C.dim],[46,C.dim],[6,C.red,40,C.red]];
  var lines=[], li=0;
  function draw(){
    while(g.firstChild) g.removeChild(g.firstChild);
    lines.forEach(function(L,i){ var x=6, y=5+i*LH;
      for(var j=0;j<L.length;j+=2){ var e=document.createElementNS(NS,"rect"); e.setAttribute("x",x); e.setAttribute("y",y); e.setAttribute("width",L[j]);
        e.setAttribute("height",5.6); e.setAttribute("rx",1); e.setAttribute("fill",L[j+1]); g.appendChild(e); x+=L[j]+2.4; }
      if(i===lines.length-1 && on){ var c=document.createElementNS(NS,"rect"); c.setAttribute("x",x); c.setAttribute("y",y-.6); c.setAttribute("width",3.4); c.setAttribute("height",7); c.setAttribute("fill",C.cream); g.appendChild(c); }
    });
  }
  function next(){ lines.push(script[li%script.length]); li++; if(lines.length>MAX) lines.shift(); draw(); }
  for(var i=0;i<6;i++) next();
  if(!reduce){ setInterval(next,1600); setInterval(function(){ on=!on; draw(); },520); }
})();

/* ---------- 404 decrypts into place, like the main site ---------- */
(function(){
  var el=$("#code"), text="404"; if(reduce) return;
  var SYM="#%&*+=<>/\\|{}[]$@!?0123456789ABCDEFGHJKLMNPRSTUVWXYZ";
  el.innerHTML=""; var spans=[];
  for(var i=0;i<text.length;i++){ var s=document.createElement("span"); s.className="ch"; s.setAttribute("aria-hidden","true"); s.textContent=text[i]; el.appendChild(s); spans.push(s); }
  function start(){
    spans.forEach(function(s){ s.style.width=s.getBoundingClientRect().width+"px"; });
    var total=2200, t0=performance.now(), last=0, locks=[total*.35,total*.6,total*.9];
    (function f(now){ var t=now-t0;
      if(now-last>70){ last=now; spans.forEach(function(s,k){ if(t>=locks[k]){ s.textContent=text[k]; s.className="ch"; } else { s.textContent=SYM[Math.floor(Math.random()*SYM.length)]; s.className="ch off"; } }); }
      if(t<total+80) requestAnimationFrame(f); else el.textContent=text; })(t0);
  }
  if(document.fonts && document.fonts.ready){ var done=false; document.fonts.ready.then(function(){ if(!done){done=true;start();} }); setTimeout(function(){ if(!done){done=true;start();} },1500); } else start();
})();

paint();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
})();
</script>
