/* Layout: one sheet of rice paper. Home is a full ink-wash poster (sun, ridges, lake, bangka);
   inner pages share a short ridge band with a vertical Baybayin title on the right margin. */
:root{
  --paper:#f0e6cc;      /* cream ground, sampled from the poster */
  --paper-deep:#e5d7b6; /* mist, hairline fills */
  --ink:#24201b;        /* sumi ink */
  --ink-soft:#544b3f;   /* body text */
  --ink-faint:#8c826f;  /* captions, rules */
  --sun:#d63f29;        /* araw red */
  --rule:rgba(36,32,27,.18);
  --paper-rgb:240,230,204;   /* same colors as triplets, for rgba() */
  --deep-rgb:229,215,182;
  --field-rgb:255,250,236;
  --scene-ink:36,32,27;      /* mountains, lake lines (canvas) */
  --boat:#24201b;
  --streak:#f0e6cc;
  --sky-top:240,230,204;     /* sky gradient (behind the mountains) */
  --sky-hor:240,230,204;
  --sunset-a:0;              /* orange glow where the sun sets */
  --stars:0;
  --font-display:"BantayBaybayin","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Times New Roman",serif;
  --font-body:"BantayBaybayin","Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-name:"BantayBaybayin","Orbitron","Eurostile","Bank Gothic","Arial Black",sans-serif; /* squared, rounded-corner capitals like garryhall.me */
  --font-mono:"BantayBaybayin","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --measure:62ch;
  color-scheme:light;
}
/* Night: switched on by clicking the sun. A class, not data-theme, so it never clashes with a host's theme switch. */
html.night{
  --paper:#262a35; --paper-deep:#313644; --ink:#efe6cf; --ink-soft:#cbc2ac; --ink-faint:#8f8b80; --sun:#e0583f;
  --rule:rgba(239,230,207,.16);
  --paper-rgb:38,42,53; --deep-rgb:49,54,68; --field-rgb:70,76,92;
  --scene-ink:5,6,9; --boat:#08090c; --streak:#3a4050;
  --sky-top:28,31,41; --sky-hor:47,52,66; --stars:1;
  color-scheme:dark;
}
/* sky behind the mountains: gradient + sunset glow + stars, all driven by the day/night tokens */
.sky{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 44% 30% at var(--set-x,55%) var(--set-y,56%), rgba(255,138,78,var(--sunset-a,0)), rgba(255,138,78,0)),
    linear-gradient(to bottom, rgb(var(--sky-top)) 0, rgb(var(--sky-top)) 46px, rgb(var(--sky-hor)) 70%, rgb(var(--sky-hor)) 100%)}
/* ^ the sky holds the top color for its first 46px (24px tucked under the bar + its 22px fade), so the seam under the bar disappears */
.sky .stars{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;opacity:var(--stars,0)}
.sky .stars.tw{animation:twinkle 4.5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:var(--stars,0)}to{opacity:calc(var(--stars,0) * .3)}}
canvas[data-scene]{transition:opacity .45s ease}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink-soft);
  font-family:var(--font-body);font-size:16.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
/* paper grain. Not position:fixed on purpose: iPhone Safari colors the strip behind the status bar
   from the topmost fixed element at the top edge, so a fixed, transparent texture layer above the top bar
   made Safari show the page there instead. It now lies over the page (below the bar), and the bar has the grain's average color baked in. */
body{position:relative}
body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:39;opacity:.38;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
::selection{background:var(--sun);color:var(--paper)}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:2px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Baybayin glyphs (vector, traced from the alphabet chart) ---------- */
svg.bg{display:inline-block;height:1em;overflow:visible;fill:currentColor;vertical-align:-.2em}
[data-stack]{display:flex;flex-direction:column;align-items:center}
[data-stack] svg.bg{display:block}
.vert[data-stack]{gap:.12em}
/* Home motto: one vertical line, top to bottom; a wider gap marks each new word.
   Sized from the poster height so all 8 glyphs fit in the sky at every screen size. */
/* top: never inside the soft fade under the top bar (the poster tucks 24px under the bar, the fade reaches
   22px below it, plus 10px of air = 56px); on tall screens the 5% wins */
.vert.vert-cols{flex-direction:column;align-items:center;gap:.55em;font-size:calc(clamp(560px,82vh,840px) * .045);top:max(5%,56px)}
.vert.vert-cols > div{gap:.1em}
/* Hover (or tap / keyboard focus) the motto to read it in English. The English sits in the same box as the
   Baybayin: each word is a column of upright letters, with a wider gap between words.
   fitMotto() picks a font size so it never runs past the Baybayin's height or width. */
.vert.vert-cols{cursor:help;-webkit-tap-highlight-color:transparent}
.vert.vert-cols > [data-stack]{transition:opacity .45s ease,filter .45s ease}
.vert.vert-cols > .motto-en{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;opacity:0;pointer-events:none;transition:opacity .45s ease}
.motto-en .w{display:block;writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;-webkit-text-orientation:upright;
  font-family:"Orbitron","Eurostile","Bank Gothic",system-ui,sans-serif;font-weight:500;line-height:1;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.motto-en .w + .w{margin-top:.6em}
.motto-en .w.mid{color:var(--sun)}
.vert.vert-cols.en > [data-stack]{opacity:0;filter:blur(2px)}
.vert.vert-cols.en > .motto-en{opacity:1}
/* black & white glitch before the English appears: both layers are cut into horizontal bands
   that jolt sideways; ink and paper ghosts tear the letters. ~0.5s, then the English settles. */
.vert.vert-cols.mg > *,.vert.vert-cols.mgb > *,.vert.vert-cols.snap > *{transition:none!important}
.vert.vert-cols.mg > [data-stack]{opacity:1;filter:none;animation:mg-out .5s steps(1,end) both}
.vert.vert-cols.mg > .motto-en{opacity:1;animation:mg-in .5s steps(1,end) both}
/* the way back: same burst mirrored, the English breaks up and the Baybayin tears back in */
.vert.vert-cols.mgb > [data-stack]{opacity:1;filter:none;animation:mg-in .5s steps(1,end) both}
.vert.vert-cols.mgb > .motto-en{opacity:1;animation:mg-out .5s steps(1,end) both}
.vert.vert-cols.mg .w,.vert.vert-cols.mgb .w{text-shadow:.12em 0 0 var(--paper),-.1em 0 0 var(--ink)}
.vert.vert-cols.mg .w.mid,.vert.vert-cols.mgb .w.mid{color:var(--ink)}
@keyframes mg-out{
  0%  {clip-path:inset(0 0 0 0);transform:none}
  10% {clip-path:inset(12% 0 58% 0);transform:translateX(-.18em)}
  22% {clip-path:inset(46% 0 30% 0);transform:translateX(.22em) skewX(-8deg)}
  34% {clip-path:inset(0 0 72% 0);transform:translateX(-.1em)}
  46% {clip-path:inset(70% 0 4% 0);transform:translateX(.3em)}
  58% {clip-path:inset(30% 0 52% 0);transform:translateX(-.24em) skewX(6deg)}
  70% {clip-path:inset(84% 0 0 0);transform:translateX(.12em)}
  82%,100%{clip-path:inset(0 0 100% 0);transform:none}}
@keyframes mg-in{
  0%  {clip-path:inset(0 0 100% 0);transform:none}
  10% {clip-path:inset(60% 0 22% 0);transform:translateX(.24em)}
  22% {clip-path:inset(4% 0 70% 0);transform:translateX(-.2em) skewX(8deg)}
  34% {clip-path:inset(38% 0 36% 0);transform:translateX(.16em)}
  46% {clip-path:inset(0 0 48% 0);transform:translateX(-.28em)}
  58% {clip-path:inset(52% 0 0 0);transform:translateX(.1em) skewX(-6deg)}
  70% {clip-path:inset(18% 0 10% 0);transform:translateX(-.08em)}
  82% {clip-path:inset(0 0 0 0);transform:translateX(.05em)}
  100%{clip-path:inset(0 0 0 0);transform:none}}
.vert.vert-cols:focus-visible{outline-offset:6px}
.cartouche[data-stack]{gap:.18em}

/* ---------- header ---------- */
/* Fixed to the very top and padded down by the iPhone status-bar height, so the bar covers the area
   behind the clock and battery. It needs a SOLID background-color: Safari 26 colors the status-bar area
   from a full-width fixed bar's background-color (a gradient alone doesn't count, and the page shows through).
   The soft fade under it is a separate layer (::after). --hdr (set by script) reserves its height. */
.top{
  position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);
  background-color:rgb(var(--sky-top));
  /* the grain texture's average color, baked in: the strip Safari paints behind the clock (flat color only)
     and the bar are then identical, and both match the grainy sky below. 4.15% of the grain tan, measured. */
  background-color:color-mix(in srgb, rgb(var(--sky-top)) 95.85%, rgb(197,182,155));
}
.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;pointer-events:none;
  background:linear-gradient(color-mix(in srgb, rgb(var(--sky-top)) 95.85%, rgb(197,182,155)),rgba(var(--sky-top),0))}
body{padding-top:var(--hdr,calc(80px + env(safe-area-inset-top,0px)))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 10px}
.seal{
  display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
}
.seal-mark{
  width:34px;height:34px;display:grid;place-items:center;border-radius:4px;
  background:var(--sun);color:var(--paper);font-size:19px;line-height:1;
  box-shadow:inset 0 0 0 2px rgba(var(--paper-rgb),.35);transform:rotate(-3deg);
}
.seal-name{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:clamp(10px,2.4vw,30px);flex-wrap:wrap;justify-content:flex-end}
nav a{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  text-decoration:none;color:var(--ink-faint);padding:6px 0;position:relative;transition:color .4s;
}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink)}
nav a[aria-current="page"]::after{
  content:"";position:absolute;left:50%;bottom:-4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--sun);
}

/* ---------- pages ---------- */
.page{animation:fadeIn 1.4s ease both}
@keyframes fadeIn{from{opacity:.0}to{opacity:1}}

/* ---------- black & white cyber glitch on page titles ----------
   Two ghost copies of the title (from data-text): one in ink, one in paper colour.
   During a burst they are sliced into horizontal bands and jolted sideways,
   tearing the letters. Bursts are short and occasional (see glitch script). */
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;
  white-space:pre-line;pointer-events:none;opacity:0;clip-path:inset(0 0 100% 0);-webkit-clip-path:inset(0 0 100% 0)}
.glitch::before{color:var(--ink)}
.glitch::after{color:var(--paper);text-shadow:.03em 0 0 var(--ink)}
.glitch.is-glitching{animation:gl-jolt .5s steps(1,end) both}
.glitch.is-glitching::before{opacity:1;animation:gl-a .5s steps(1,end) both}
.glitch.is-glitching::after{opacity:1;animation:gl-b .5s steps(1,end) both}
@keyframes gl-a{
  0%  {clip-path:inset(8% 0 74% 0);-webkit-clip-path:inset(8% 0 74% 0);transform:translateX(-.05em)}
  15% {clip-path:inset(58% 0 22% 0);-webkit-clip-path:inset(58% 0 22% 0);transform:translateX(.07em)}
  30% {clip-path:inset(30% 0 55% 0);-webkit-clip-path:inset(30% 0 55% 0);transform:translateX(-.03em)}
  45% {clip-path:inset(80% 0 6% 0);-webkit-clip-path:inset(80% 0 6% 0);transform:translateX(.05em)}
  60% {clip-path:inset(4% 0 88% 0);-webkit-clip-path:inset(4% 0 88% 0);transform:translateX(-.08em)}
  75% {clip-path:inset(44% 0 40% 0);-webkit-clip-path:inset(44% 0 40% 0);transform:translateX(.03em)}
  90% {clip-path:inset(66% 0 18% 0);-webkit-clip-path:inset(66% 0 18% 0);transform:translateX(-.02em)}
  100%{clip-path:inset(0 0 100% 0);-webkit-clip-path:inset(0 0 100% 0);transform:none}}
@keyframes gl-b{
  0%  {clip-path:inset(62% 0 26% 0);-webkit-clip-path:inset(62% 0 26% 0);transform:translateX(.06em)}
  15% {clip-path:inset(14% 0 72% 0);-webkit-clip-path:inset(14% 0 72% 0);transform:translateX(-.06em)}
  30% {clip-path:inset(84% 0 4% 0);-webkit-clip-path:inset(84% 0 4% 0);transform:translateX(.04em)}
  45% {clip-path:inset(36% 0 50% 0);-webkit-clip-path:inset(36% 0 50% 0);transform:translateX(-.09em)}
  60% {clip-path:inset(70% 0 12% 0);-webkit-clip-path:inset(70% 0 12% 0);transform:translateX(.05em)}
  75% {clip-path:inset(20% 0 66% 0);-webkit-clip-path:inset(20% 0 66% 0);transform:translateX(-.04em)}
  90% {clip-path:inset(50% 0 38% 0);-webkit-clip-path:inset(50% 0 38% 0);transform:translateX(.02em)}
  100%{clip-path:inset(0 0 100% 0);-webkit-clip-path:inset(0 0 100% 0);transform:none}}
@keyframes gl-jolt{0%{transform:none}20%{transform:translateX(.012em) skewX(-2deg)}40%{transform:translateX(-.015em)}60%{transform:none}80%{transform:translateX(.01em) skewX(1deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){ .glitch.is-glitching,.glitch.is-glitching::before,.glitch.is-glitching::after{animation:none;opacity:0} }

/* ---------- home poster ---------- */
.poster{position:relative;height:clamp(560px,82vh,840px);overflow:hidden;margin-top:-24px}
.poster canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sun{
  position:absolute;left:12%;top:9%;width:clamp(120px,17vw,220px);aspect-ratio:1;max-width:100%;
}
.sun{border:0;background:none;padding:0;margin:0;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;border-radius:50%}
.sun:focus-visible{outline-offset:6px;border-radius:50%}
.sun .orb{position:absolute;inset:0;display:block;will-change:transform}
.sun .orb svg{position:relative;width:100%;height:100%;display:block;overflow:visible}
.sun .orb-sun svg{transform-origin:50% 50%;animation:turn 240s linear infinite}
/* glow travels with its orb, so it is always centred on it; --glow-r is capped in JS so it never reaches the nav bar */
.sun .orb::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--glow-r,100px) * 2);height:calc(var(--glow-r,100px) * 2);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,var(--glow-c),rgba(0,0,0,0))}
.sun .orb-sun{--glow-c:rgba(214,63,41,.13)}
.sun .orb-moon{--glow-c:rgba(255,244,214,.17);opacity:0}
html.night .sun .orb-sun{opacity:0}
html.night .sun .orb-moon{opacity:1}
@media (hover:hover){ .sun:hover .orb{transform:scale(1.04)} }
@keyframes turn{to{transform:rotate(360deg)}}

.vert{
  position:absolute;right:max(20px,4.5vw);top:6%;display:flex;flex-direction:column;align-items:center;gap:.02em;
  color:var(--ink);font-size:clamp(40px,5.4vw,76px);line-height:1;
}
.vert span{display:block}
.vert-cap{
  position:absolute;right:max(16px,4.5vw);font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-faint);writing-mode:vertical-rl;
}
.poster .vert-cap{top:6%;right:calc(max(20px,4.5vw) + clamp(46px,6vw,84px))}

.bangka{
  --bw:clamp(240px,31vw,430px);
  position:absolute;left:57%;width:var(--bw);max-width:100%;
  top:calc(76% - var(--bw) * .3167);   /* .3167 = 95/300: the boat's waterline sits at 76% of the poster, on the lake */
}
.bangka{color:var(--boat)}
.bangka svg{display:block;width:100%;height:auto;overflow:visible}
.bangka .streaks{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-3px)}to{transform:translateX(4px)}}

.ident{
  position:absolute;left:0;right:0;bottom:6%;
}
.ident .wrap{display:flex;align-items:flex-end;gap:clamp(16px,3vw,36px)}
/* name row: the oval runs from the cap-top of GABE to the baseline of BARRERA (margins set by alignCartouche()) */
.name-row{display:flex;align-items:stretch;gap:clamp(14px,2.2vw,30px)}
.cartouche{
  flex:none;border:1.5px solid var(--ink);border-radius:999px;
  padding-inline:max(8px, calc(clamp(40px,6.2vw,88px) * .12));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(var(--paper-rgb),.55);
  color:var(--ink);font-size:max(17px, calc(clamp(40px,6.2vw,88px) * .34));line-height:1;
}
.ident-text{min-width:0}
.eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px;
}
.eyebrow b{color:var(--sun);font-weight:500}
h1.name{
  margin:0;font-family:var(--font-name);font-weight:600;color:var(--ink);text-transform:uppercase;
  font-size:clamp(40px,6.2vw,88px);line-height:1;letter-spacing:.015em;white-space:nowrap;
}
h1.name .ch.br{display:block;height:0;width:auto!important}
h1.name .ch{display:inline-block;text-align:center}
.wd{white-space:nowrap}
.ch.sp{display:inline!important;width:auto!important}
h1.name .ch.on{color:var(--ink)}
h1.name .ch.off{color:var(--sun);opacity:.85}
h1.name .ch svg.bg,.band-title h2 .ch svg.bg{height:.62em;vertical-align:.02em}
.role{margin:14px 0 0;font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.status{margin:10px 0 0;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase;min-height:1.6em}
.status .ok{color:var(--sun)}
.status .dots{display:inline-block;width:3ch;text-align:left}   /* fixed width so the line never shifts as dots appear */

/* ---------- home intro ---------- */
.intro{padding-block:clamp(48px,8vw,96px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(28px,6vw,90px);align-items:start}
.intro h2,.sec-h{font-family:var(--font-display);font-weight:500;color:var(--ink);font-size:clamp(26px,3.4vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.intro p{margin:0 0 1.1em;max-width:var(--measure)}
.now{margin-top:28px;border-top:1px solid var(--rule)}
.now div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.now dt{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);padding-top:4px}
.now dd{margin:0;color:var(--ink)}
.go{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px}
.go a,.btn{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink);
  border-bottom:1px solid var(--ink);padding-bottom:3px;transition:color .3s,border-color .3s;
}
.go a:hover{color:var(--sun);border-color:var(--sun)}

/* ---------- inner page band ---------- */
.band{position:relative;height:clamp(230px,30vw,330px);overflow:hidden;margin-top:-24px}
.band canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* inner pages: sun/moon and the Baybayin title start below the top bar's fade (24px tuck + 22px fade + 10px air) */
.band .sun{width:clamp(70px,9vw,118px);left:9%;top:max(12%,56px)}
.band .vert{font-size:clamp(32px,4vw,54px);top:max(10%,56px)}
.band .vert-cap{top:max(10%,56px);right:calc(max(20px,4.5vw) + clamp(38px,4.6vw,62px))}
.band-title{position:absolute;left:0;right:0;bottom:12%}
.band-title h2{margin:0;font-family:var(--font-name);font-weight:600;text-transform:uppercase;color:var(--ink);font-size:clamp(34px,5.6vw,72px);line-height:1;letter-spacing:.015em}  /* same face as the name on Home */
.band-title h2 .ch{display:inline-block;text-align:center}
.band-title h2 .ch.off{color:var(--sun);opacity:.85}

.body{padding-block:clamp(36px,6vw,72px) 80px}
.lead{font-size:clamp(18px,1.8vw,21px);line-height:1.7;color:var(--ink);max-width:var(--measure);margin:0 0 1.2em}
.prose p{max-width:var(--measure);margin:0 0 1.15em}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:clamp(28px,6vw,84px);align-items:start}
.portrait{margin:0;position:relative}
/* Baybayin frame: glyph bands in the margin between two rules, like a seal */
.frame{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto auto;
  border:1.5px solid var(--ink);padding:6px;gap:0;color:var(--ink);font-size:clamp(17px,1.9vw,24px)}
.frame .pic{grid-column:2;grid-row:2;border:1px solid var(--rule);min-width:0}
.fb{display:flex;align-items:center;justify-content:center;gap:1.1em;line-height:1}
.fb > span{display:flex;gap:.3em}
.fb-top{grid-column:1/-1;grid-row:1;padding:.35em 0 .45em}
.fb-bottom{grid-column:1/-1;grid-row:3;padding:.45em 0 .35em}
.fb-left{grid-column:1;grid-row:2;flex-direction:column;padding:0 .45em 0 .3em}
.fb-right{grid-column:3;grid-row:2;flex-direction:column;padding:0 .3em 0 .45em}
.fb-left > span,.fb-right > span{flex-direction:column;align-items:center;gap:.22em}
.sub{margin:40px 0 0;font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
.cv{margin:12px 0 0;border-top:1px solid var(--rule)}
.cv div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.cv dt{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--ink-faint);padding-top:3px;font-variant-numeric:tabular-nums}
.cv dd{margin:0;display:flex;flex-direction:column;gap:2px}
.cv dd strong{font-weight:500;color:var(--ink)}
.portrait img{width:100%;max-width:100%;height:auto;display:block;
  -webkit-mask-image:linear-gradient(#000 82%,rgba(0,0,0,0));mask-image:linear-gradient(#000 82%,rgba(0,0,0,0))}
.portrait figcaption{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px;display:flex;align-items:center;gap:10px}
.portrait figcaption i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun)}
.skills{margin:12px 0 0;border-top:1px solid var(--rule)}
.skills div{display:grid;grid-template-columns:8em minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.skills dt{font-family:var(--font-display);color:var(--ink);font-size:18px}
.skills dd{margin:0}
.word{margin-top:40px;display:flex;gap:22px;align-items:flex-start;max-width:var(--measure)}
.word .bay{font-size:34px;line-height:1;color:var(--sun);flex:none;white-space:nowrap;padding-top:4px}
.word p{margin:0}

/* projects */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.chip{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  background:transparent;color:var(--ink-soft);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;cursor:pointer;transition:all .3s;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.proj{display:grid;grid-template-columns:3.4em minmax(0,1fr) minmax(0,15em);gap:clamp(14px,3vw,40px);padding:28px 0;border-bottom:1px solid var(--rule)}
.proj .glyph{font-size:30px;line-height:1;color:var(--ink);padding-top:4px}
.proj h3{margin:0 0 6px;font-family:var(--font-display);font-weight:500;font-size:clamp(21px,2.3vw,26px);color:var(--ink);line-height:1.3}
.proj p{margin:0;max-width:var(--measure)}
.meta{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;color:var(--ink-faint);display:flex;flex-direction:column;gap:6px;padding-top:6px}
.meta .st{color:var(--ink);text-transform:uppercase;letter-spacing:.18em}
.meta .st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-faint);margin-right:8px;vertical-align:1px}
.meta .st.live::before{background:var(--sun)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{border:1px solid var(--rule);border-radius:3px;padding:1px 7px}

/* blog */
.posts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.post{border-bottom:1px solid var(--rule)}
.post-btn{
  all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:8.5em minmax(0,1fr) 1.4em;gap:clamp(12px,3vw,36px);
  padding:24px 0;align-items:baseline;
}
.post-btn:focus-visible{outline:2px solid var(--sun);outline-offset:4px}
.post-date{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.post-title{font-family:var(--font-display);font-size:clamp(20px,2.2vw,25px);color:var(--ink);line-height:1.35;font-weight:500}
.post-sum{display:block;font-family:var(--font-body);font-size:15.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
.post-ico{font-family:var(--font-mono);color:var(--ink-faint);transition:transform .5s}
.post-btn[aria-expanded="true"] .post-ico{transform:rotate(45deg);color:var(--sun)}
.post-body{padding:0 0 30px calc(8.5em + clamp(12px,3vw,36px))}
.post-body p{max-width:var(--measure);margin:0 0 1.1em}
.post-body .tags{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-top:14px}
code,.mono{font-family:var(--font-mono);font-size:.88em;background:var(--paper-deep);padding:1px 6px;border-radius:3px;color:var(--ink)}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(28px,6vw,84px);align-items:start}
.addr{margin-top:26px;border-top:1px solid var(--rule)}
.addr div{display:grid;grid-template-columns:7em minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:center}
.addr dt{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
.addr dd{margin:0;color:var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.copy{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid var(--rule);
  color:var(--ink-soft);border-radius:3px;padding:3px 9px;cursor:pointer;transition:all .3s
}
.copy:hover{border-color:var(--ink);color:var(--ink)}
.note{margin-top:26px;padding:16px 18px;border-left:2px solid var(--sun);background:rgba(var(--deep-rgb),.45);font-size:15px;max-width:var(--measure)}
.note strong{color:var(--ink);font-weight:500}
form{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
.field input,.field textarea,.field select{
  font:inherit;color:var(--ink);background:rgba(var(--field-rgb),.35);border:0;border-bottom:1px solid var(--ink-faint);
  border-radius:0;padding:10px 2px;width:100%;transition:border-color .3s,background .3s;-webkit-appearance:none;appearance:none;
}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.field textarea{min-height:150px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sun);background:rgba(var(--field-rgb),.7)}
.field .err{font-size:13px;color:var(--sun);min-height:0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.submit{
  justify-self:start;font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border:0;border-radius:2px;padding:14px 26px;cursor:pointer;transition:background .3s
}
.submit:hover{background:var(--sun)}
.sealed{margin-top:8px;border:1px solid var(--rule);padding:20px;background:rgba(var(--field-rgb),.4)}
.sealed h3{margin:0 0 8px;font-family:var(--font-display);font-weight:500;color:var(--ink);font-size:22px}
.sealed pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:13px;line-height:1.6;background:var(--paper-deep);padding:14px;border-radius:3px;margin:12px 0;color:var(--ink);max-height:280px;overflow:auto}
.sealed .acts{display:flex;gap:18px;flex-wrap:wrap;align-items:center}

/* footer */
footer{border-top:1px solid var(--rule);margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:26px 34px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
footer .bay{color:var(--sun);text-transform:none;font-size:17px}

.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* ---------- subheadings: Orbitron regular, mixed case (the garryhall.me tagline face) ---------- */
:root{--font-sub:"BantayBaybayin","Orbitron","Eurostile","Bank Gothic",system-ui,sans-serif}
.role,.intro h2,.lead,.proj h3,.post-title,.skills dt,.sealed h3,.sub{font-family:var(--font-sub);font-weight:400;letter-spacing:.01em}
.role{text-transform:none;font-size:clamp(15px,1.55vw,19px);letter-spacing:.02em;color:var(--ink-soft)}
.intro h2{font-size:clamp(21px,2.6vw,30px);line-height:1.35}
.lead{font-size:clamp(16px,1.55vw,19px);line-height:1.65}
.proj h3{font-size:clamp(17px,1.8vw,21px);line-height:1.35}
.post-title{font-size:clamp(16px,1.75vw,20px);line-height:1.4}
.skills dt{font-size:15px;padding-top:2px}
.sealed h3{font-size:19px}
.sub{font-size:12.5px;letter-spacing:.16em;color:var(--ink-faint)}

/* ---------- rich text from the editor ---------- */
.rt ul,.rt ol{margin:0 0 1.1em;padding-left:1.4em;max-width:var(--measure)}
.rt li{margin:.25em 0}
.rt blockquote{margin:0 0 1.1em 1.6em;padding:0}
.rt a,.lead a,[data-edit] a,[data-part] a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--sun);text-underline-offset:3px}
.fs-1{font-size:.7em}.fs-2{font-size:.85em}.fs-3{font-size:1em}.fs-4{font-size:1.15em}.fs-5{font-size:1.35em}.fs-6{font-size:1.6em}.fs-7{font-size:2em}
.post-btn:focus-visible{outline:2px solid var(--sun);outline-offset:4px}

/* ---------- events ---------- */
.elist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.evt{display:grid;grid-template-columns:5.2em minmax(0,1fr) minmax(0,13em);gap:clamp(14px,3vw,40px);padding:26px 0;border-bottom:1px solid var(--rule)}
.evt-date{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border:1px solid var(--rule);border-radius:4px;padding:8px 4px 7px;text-align:center;font-family:var(--font-mono);color:var(--ink);align-self:start}
.evt-mon{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun)}
.evt-day{font-family:var(--font-name);font-weight:600;font-size:26px;line-height:1.15}
.evt-yr{font-size:10.5px;letter-spacing:.12em;color:var(--ink-faint)}
.evt-format{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.evt h3{margin:0 0 6px;font-family:var(--font-sub);font-weight:400;font-size:clamp(17px,1.8vw,21px);line-height:1.35;color:var(--ink)}
.evt-where{margin:0 0 8px;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft)}
.evt p{margin:0;max-width:var(--measure)}
.evt .meta{padding-top:2px}

/* ---------- clickable list items (projects, events): data-link set from admin.html ---------- */
[data-link]{cursor:pointer}
[data-link] h3::after{content:" \2197";font-family:var(--font-mono);font-size:.8em;color:var(--ink-faint);transition:color .3s}
[data-link]:hover h3,[data-link]:focus-visible h3{color:var(--sun)}
[data-link]:hover h3::after,[data-link]:focus-visible h3::after{color:var(--sun)}
[data-link]:focus-visible{outline:2px solid var(--sun);outline-offset:6px;border-radius:2px}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .intro,.about,.contact{grid-template-columns:minmax(0,1fr)}
  .portrait{max-width:420px}
  .proj{grid-template-columns:2.6em minmax(0,1fr)}
  .proj .meta{grid-column:2}
  .post-body{padding-left:0}
  .evt{grid-template-columns:4.4em minmax(0,1fr)}
  .evt .meta{grid-column:2}
}
@media (max-width:600px){
  .top .wrap{flex-direction:column;align-items:flex-start;gap:10px;padding-block:14px 8px}
  body{padding-top:var(--hdr,calc(118px + env(safe-area-inset-top,0px)))}
  nav ul{justify-content:flex-start;gap:16px}
  nav a{font-size:11px;letter-spacing:.14em}
}
@media (max-width:430px){
  nav ul{gap:11px}
  nav a{letter-spacing:.1em}
}
@media (max-width:600px){
  .poster{height:680px}
  .vert.vert-cols{font-size:24px;top:max(4%,56px)}
  .sun{left:7%;top:5%}
  .bangka{left:30%;top:calc(63.5% - var(--bw) * .3167)}  /* phones: matches the higher lake line (62%) */
  .ident{bottom:5%}
  h1.name{white-space:normal}
  .post-btn{grid-template-columns:minmax(0,1fr) 1.4em}
  .post-date{grid-column:1/-1;margin-bottom:-14px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .now div,.skills div,.addr div,.cv div{grid-template-columns:minmax(0,1fr);gap:2px}
  .band .vert-cap,.poster .vert-cap{display:none}
}
@media (prefers-reduced-motion:reduce){
  .sun .orb-sun svg,.bangka .streaks,.page{animation:none!important}
  .sun .orb{transition:none!important}
  .vert.vert-cols > *{transition:none!important;animation:none!important}
  .sky .stars.tw{animation:none!important}
}

/* ============================================================
   The Syslog: post lists (blog.html) and post pages
   ============================================================ */
.post-link{display:grid;grid-template-columns:8.5em minmax(0,1fr) auto;gap:clamp(12px,3vw,36px);padding:24px 0;align-items:baseline;text-decoration:none;color:inherit;border-radius:2px}
.post-link:hover .post-title,.post-link:focus-visible .post-title{color:var(--sun)}
.post-link:focus-visible{outline:2px solid var(--sun);outline-offset:4px}
.post-link .post-title{display:block;transition:color .3s}
.post-sec{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.post-link .tags{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:10px}
.post-empty{padding:26px 0;color:var(--ink-faint);font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;border-bottom:1px solid var(--rule)}
.count{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 18px}
.latest{margin-top:clamp(40px,6vw,70px)}
.latest-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 14px}
.latest-head h3{margin:0;font-family:var(--font-sub);font-weight:400;font-size:clamp(19px,2vw,23px);color:var(--ink)}
.latest-head a,.home-link{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);text-decoration:none}
.latest-head a:hover,.home-link:hover{color:var(--sun)}
.secs a{color:inherit;text-decoration:none}
.secs a:hover dd,.secs a:hover dt{color:var(--sun)}
@media (max-width:600px){
  .post-link{grid-template-columns:minmax(0,1fr)}
  .post-link .post-date{margin-bottom:-14px}
  .post-link .post-sec{order:-1;margin-bottom:-16px}
}

/* ---------- a single post ---------- */
.band.post-band{height:clamp(330px,38vw,470px)}
.band.post-band .band-title{bottom:9%}
.band.post-band .band-title h2{font-size:clamp(27px,4.3vw,58px);line-height:1.1;max-width:calc(100% - 70px)}
.post-kicker{margin:0 0 12px;font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.post-kicker a{color:var(--ink-faint);text-decoration:none}
.post-kicker a:hover{color:var(--sun)}
.post-meta{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 22px}
.article{width:100%}
.article-body{font-size:17px;line-height:1.8;color:var(--ink-soft)}
.article.ff-serif .article-body{font-family:var(--font-display);font-size:18px}
.article.ff-mono .article-body{font-family:var(--font-mono);font-size:15px}
.article.ff-display .article-body{font-family:var(--font-sub);font-size:16px}
.article-body > *{max-width:var(--measure);margin:0 0 1.15em}
.article.w-wide .article-body > *{max-width:78ch}
.article-body > .w-wide{max-width:920px}
.article-body > .w-full{max-width:none}
.article-body h2{font-family:var(--font-sub);font-weight:400;font-size:clamp(22px,2.4vw,28px);line-height:1.3;color:var(--ink);margin:1.8em 0 .6em}
.article-body h3{font-family:var(--font-sub);font-weight:400;font-size:clamp(19px,2vw,22px);line-height:1.35;color:var(--ink);margin:1.5em 0 .5em}
.article-body a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--sun);text-underline-offset:3px}
.article-body a:hover{color:var(--sun)}
.article-body strong,.article-body b{color:var(--ink);font-weight:500}
.article-body :not(pre) > code{font-family:var(--font-mono);font-size:.86em;background:rgba(var(--deep-rgb),.7);padding:1px 6px;border-radius:3px;color:var(--ink)}
.article-body mark{background:rgba(214,63,41,.2);color:inherit;padding:0 2px;border-radius:2px}
.article-body ul,.article-body ol{padding-left:1.4em}
.article-body li{margin:.25em 0}
.article-body .rich p{margin:0 0 1.15em}
.article-body .rich > :last-child{margin-bottom:0}
blockquote.quote{border-left:2px solid var(--sun);padding:.2em 0 .2em 1.1em;margin-left:0;font-family:var(--font-display);font-size:1.12em;line-height:1.7;color:var(--ink)}
blockquote.quote cite{display:block;margin-top:.7em;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;font-style:normal;color:var(--ink-faint)}
.callout{border-left:2px solid var(--ink-faint);background:rgba(var(--deep-rgb),.45);padding:14px 18px;border-radius:0 3px 3px 0}
.callout.tip{border-left-color:var(--ink)}
.callout.warn{border-left-color:var(--sun)}
.callout-label{display:block;margin-bottom:4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
.callout.warn .callout-label{color:var(--sun)}
figure.code{margin:1.6em 0;border-radius:6px;overflow:hidden;background:#1d1a16;color:#efe5cc;max-width:min(920px,100%)!important}
html.night figure.code{background:#111216}
figure.code figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 12px;background:#2c2721;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:#c9bc9c}
html.night figure.code figcaption{background:#1c1e25}
figure.code .copy-btn{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:#d63f29;color:#fff;border:0;border-radius:3px;padding:4px 11px;cursor:pointer}
figure.code .copy-btn:hover{filter:brightness(1.1)}
figure.code pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;tab-size:4;-moz-tab-size:4;white-space:pre}
figure.code code{font-family:inherit;font-size:inherit;background:none;padding:0;border-radius:0;color:inherit}
.tk-c{color:#8c826f;font-style:italic}.tk-s{color:#d9b36a}.tk-k{color:#ee7b60}.tk-n{color:#9cc4a4}.tk-f{color:#f6ecd3;font-weight:500}.tk-v{color:#9fb7d9}
figure.img{margin:1.8em 0}
figure.img img{display:block;width:100%;height:auto;border-radius:3px}
figure.img figcaption,figure.embed figcaption,.tbl-cap{margin-top:8px;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--ink-faint)}
figure.embed{margin:1.8em 0;max-width:920px!important}
.embed-box{position:relative;aspect-ratio:16/9;background:rgba(var(--deep-rgb),.6);border-radius:4px;overflow:hidden}
.embed-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poem{font-family:var(--font-display);font-size:1.12em;line-height:1.95;color:var(--ink)}
.poem .poem-title{font-family:var(--font-sub);font-size:.9em;letter-spacing:.02em;color:var(--ink);margin:0 0 .8em}
.poem .stanza{margin:0 0 1.3em;white-space:pre-wrap}
.poem .stanza:last-child{margin-bottom:0}
.poem.al-center{text-align:center}
hr.div{border:0;height:1px;background:var(--rule);margin:2.4em 0}
.div-dots,.div-bay{text-align:center;color:var(--ink-faint);margin:2.2em 0}
.div-dots{letter-spacing:.9em;font-family:var(--font-mono)}
.div-bay{color:var(--sun);font-size:26px;line-height:1}
.tbl{overflow-x:auto;max-width:920px!important}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:9px 12px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,4vw,44px);max-width:920px!important}
@media (max-width:700px){ .cols{grid-template-columns:minmax(0,1fr)} }
.al-center{text-align:center}.al-right{text-align:right}.al-left{text-align:left}
.ff-serif{font-family:var(--font-display)}.ff-mono{font-family:var(--font-mono);font-size:.93em}.ff-display{font-family:var(--font-sub)}.ff-body{font-family:var(--font-body)}
.fs-sm{font-size:.86em}.fs-lg{font-size:1.2em}.fs-xl{font-size:1.45em}
.c-sun{color:var(--sun)}.c-faint{color:var(--ink-faint)}.c-ink{color:var(--ink)}
.post-tags{margin-top:34px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint)}
.post-foot{display:flex;gap:24px;flex-wrap:wrap;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.post-foot a{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);text-decoration:none}
.post-foot a:hover{color:var(--sun)}
/* reading progress: lives inside the fixed top bar, so the bar stays the only fixed element (see the iPhone note) */
.read-bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--sun);z-index:3;pointer-events:none}
@media (max-width:600px){
  .article-body{font-size:16.5px}
  .band.post-band .band-title h2{max-width:calc(100% - 56px)}
}

</style>

<!-- ======================= shared SVG defs ======================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="inkEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="0.9"/>
    </filter>
    <radialGradient id="sunWash" cx="45%" cy="40%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#d8412b"/>

<script>
/* Day/night default: local time decides (6:00am-5:59pm day, 6:00pm-5:59am night).
   A click on the sun/moon overrides it only until the next 6am/6pm, then the clock takes over again.
   Stored: bantay-night ("1"/"0") + bantay-night-period (the half-day it was chosen in, e.g. "2026-10-20N"). */
function bantayMode(){
  var d=new Date(), h=d.getHours(), night=(h>=18||h<6), p=new Date(d.getTime());
  if(h<6) p.setDate(p.getDate()-1);                       // 12am-6am belongs to the previous evening's night
  var period=p.getFullYear()+"-"+(p.getMonth()+1)+"-"+p.getDate()+(night?"N":"D");
  try{ if(localStorage.getItem("bantay-night-period")===period){ var v=localStorage.getItem("bantay-night");
         if(v==="1"||v==="0") return {night:v==="1", period:period, manual:true}; } }catch(e){}
  return {night:night, period:period, manual:false};
}
try{ if(bantayMode().night) document.documentElement.classList.add("night"); }catch(e){}
</script>

function bayKey(tok){
  var fin = /\+$/.test(tok); var k = tok.replace(/\+$/,"");
  if(fin) k = k + "a";              // n+ -> na, ng+ -> nga
  k = k.replace(/e$/,"i").replace(/o$/,"u"); // be -> bi, bo -> bu (same glyph)
  return {k:k, fin:fin};
}
function bayGlyph(tok){
  var t=bayKey(tok), g=GLYPHS[t.k]; if(!g) return "";
  var cross = t.fin ? '<path d="M'+(g.w/2-1.9)+' 86 h3.8 v6 h6 v3.8 h-6 v6 h-3.8 v-6 h-6 v-3.8 h6 Z"/>' : "";
  return '<svg class="bg" viewBox="0 0 '+g.w+' 100" style="width:'+(g.w/100).toFixed(3)+'em" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="'+g.d+'"/>'+cross+'</svg>';
}
function renderBay(root){
  Array.prototype.forEach.call((root||document).querySelectorAll("[data-bay]"),function(el){
    el.innerHTML = el.getAttribute("data-bay").trim().split(/\s+/).map(bayGlyph).join("");
  });
}

function rng(seed){ return function(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
function ridge(rand, w, n, rough){
  // midpoint displacement, returns n+1 heights in [-1,1]
  var pts = new Array(n+1); pts[0]=rand()*2-1; pts[n]=rand()*2-1;
  var step=n, amp=1;
  while(step>1){
    var half=step/2;
    for(var i=half;i<n;i+=step){ pts[i]=(pts[i-half]+pts[i+half])/2 + (rand()*2-1)*amp; }
    amp*=rough; step=half;
  }
  return pts;
}
var SCN={ink:"36,32,27",paper:"240,230,204",hor:"240,230,204",k:1,night:false};
function readScene(){
  var cs=getComputedStyle(document.documentElement), ph=(typeof PHASE==="number")?PHASE:0;
  SCN={ink:(cs.getPropertyValue("--scene-ink")||"36,32,27").trim(), paper:(cs.getPropertyValue("--paper-rgb")||"240,230,204").trim(),
       hor:(cs.getPropertyValue("--sky-hor")||"240,230,204").trim(), k:1+1.3*ph, night:ph>.6};
}
/* Philippine lowland jungle along a ridge: a dense canopy of overlapping rounded crowns,
   a few taller emergent trees, and scattered coconut palms leaning over it.
   Same overall height as the old pine row (about 8-24px on a 700px-tall scene). */
function drawJungle(ctx,W,H,o,yAt,n,A){
  var rand=rng(o.seed+7), u=H/700, x0=o.trees.from*W, x1=o.trees.to*W, span=x1-x0;
  var col="rgba("+SCN.ink+","+(A*.95)+")";
  function ridgeY(x){ return yAt(Math.max(0,Math.min(n,Math.round(x/W*n)))); }
  // only grow upward from the ridge: clip to the sky above the ridgeline
  ctx.save(); ctx.beginPath(); ctx.moveTo(0,0);
  for(var ci=0;ci<=n;ci++) ctx.lineTo(ci/n*W, yAt(ci)+.5);
  ctx.lineTo(W,0); ctx.closePath(); ctx.clip();
  // 1. canopy: crowns laid edge to edge so the forest reads as one dense mass
  ctx.beginPath();
  var x=x0;
  while(x<x1){
    var r=(3.2+rand()*4.2)*u, y=ridgeY(x)-r*.35;
    ctx.moveTo(x+r*1.25,y); ctx.ellipse(x,y,r*1.25,r,0,0,Math.PI*2);
    // a second, smaller crown tucked behind for depth
    if(rand()<.6){ var r2=r*(.6+rand()*.3), xo=x+(rand()-.5)*r*1.6, yo=y-r*.55; ctx.moveTo(xo+r2*1.2,yo); ctx.ellipse(xo,yo,r2*1.2,r2,0,0,Math.PI*2); }
    x+=r*(1.1+rand()*.6);
  }
  // 2. emergent trees: a trunk rising above the canopy with a broad, flat crown
  var em=Math.max(2,Math.round(o.trees.count/14));
  for(var e=0;e<em;e++){
    var ex=x0+span*(.05+rand()*.9), ey=ridgeY(ex), eh=(13+rand()*8)*u, cw=(5+rand()*3)*u;
    ctx.moveTo(ex-.7*u,ey); ctx.lineTo(ex-.5*u,ey-eh+cw*.3); ctx.lineTo(ex+.5*u,ey-eh+cw*.3); ctx.lineTo(ex+.7*u,ey); ctx.closePath();
    ctx.moveTo(ex+cw*1.3,ey-eh); ctx.ellipse(ex,ey-eh,cw*1.3,cw*.6,0,0,Math.PI*2);
    ctx.moveTo(ex+cw*.9-cw*.5,ey-eh-cw*.35); ctx.ellipse(ex-cw*.5,ey-eh-cw*.35,cw*.9,cw*.5,0,0,Math.PI*2);
  }
  ctx.fillStyle=col; ctx.fill();
  // 3. coconut palms: slim curved trunks, drooping fronds
  var palms=Math.max(3,Math.round(o.trees.count/7));
  ctx.strokeStyle=col; ctx.lineCap="round"; ctx.lineJoin="round";
  for(var p=0;p<palms;p++){
    var px=x0+span*(.03+rand()*.94), py=ridgeY(px)-1*u, ph=(15+rand()*9)*u, lean=(rand()-.5)*ph*.55;
    var tx=px+lean, ty=py-ph;
    ctx.beginPath(); ctx.lineWidth=Math.max(.8,1.25*u);
    ctx.moveTo(px,py); ctx.quadraticCurveTo(px+lean*.15,py-ph*.55,tx,ty); ctx.stroke();
    ctx.lineWidth=Math.max(.7,1.05*u); ctx.beginPath();
    var fronds=6+Math.floor(rand()*3);
    for(var f=0;f<fronds;f++){
      var ang=-Math.PI*.95+(Math.PI*.9)*(f/(fronds-1))+(rand()-.5)*.2, len=(6.5+rand()*3.5)*u;
      var ex2=tx+Math.cos(ang)*len, ey2=ty+Math.sin(ang)*len*.55+len*.45;   // tips droop below the crown
      var cx=tx+Math.cos(ang)*len*.55, cy=ty+Math.sin(ang)*len*.7-len*.18;
      ctx.moveTo(tx,ty); ctx.quadraticCurveTo(cx,cy,ex2,ey2);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(tx,ty+.6*u,1.2*u,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();   // coconuts
  }
  ctx.restore();
}
function drawLayer(ctx, W, H, o){
  var A=Math.min(.95,o.alpha*SCN.k);

  function yAt(i){
    var t=i/n, env=o.env? o.env(t):1, y;
    var v=o.valley, g=0;
    if(v){ var d=(t-v.c)/v.w; g=Math.exp(-d*d); env*= (1 - v.cut*g); }
    y=o.base*H - (pts[i]*0.5+0.5)*o.amp*H*env;

  }
  if(drawLayer.collect){ var rc=[]; for(var ri=0;ri<=n;ri++) rc.push(yAt(ri)/H); drawLayer.collect.push(rc); }
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var i=0;i<=n;i++){ ctx.lineTo(i/n*W, yAt(i)); }
  ctx.lineTo(W,H); ctx.closePath();

// After painting, record the top of the mountains (first visibly inked pixel per column)
// so the sun and moon can be clipped as they sink behind them.
function recordRidge(canvas){
  var parts=canvas._ridgeParts, r=canvas.getBoundingClientRect(); if(!parts||!parts.length||!r.width) return;
  var step=3, ys=[];
  for(var x=0;x<=r.width;x+=step){
    var t=x/r.width, best=Infinity;
    parts.forEach(function(p){ var f=t*(p.length-1), i=Math.floor(f), u=f-i, y=p[i]+((p[Math.min(i+1,p.length-1)])-p[i])*u; if(y<best) best=y; });
    ys.push(best*r.height);
  }
  canvas._ridge={step:step, ys:ys};
}
function paintVisible(){
  $all(".page:not([hidden]) canvas[data-scene]").forEach(function(c){ var was=c._painted; paintScene(c); if(!was||!c._ridge) recordRidge(c); });
  if(typeof sizeGlows==="function") sizeGlows();
  if(typeof makeStars==="function") makeStars();
}

/* ============================================================
   Decrypt effect
   ============================================================ */
var UP="ABCDEFGHIJKLMNOPQRSTUVWXYZ", LO="abcdefghijklmnopqrstuvwxyz", NUM="0123456789";
var SYM="#%&*+=<>/\\|{}[]$@!?";
var BAY=GLYPH_KEYS; // all 45 syllables from the chart
function pick(s){return s.charAt(Math.floor(Math.random()*s.length));}
var BAYCHARS=Array.from("ᜀᜁᜂᜃᜄᜅᜆᜇᜈᜉᜊᜋᜌᜎᜏᜐᜑ"); // one character per glyph in the chart font
function scrambleFor(ch){
  if(/[A-Za-z0-9]/.test(ch)) return BAYCHARS[Math.floor(Math.random()*BAYCHARS.length)];
  return ch; // spaces & punctuation stay put, so lines barely reflow
}
var runs=[]; // active animations, cancelled on tab change
function cancelRuns(){ runs.forEach(function(r){r.cancel();}); runs=[]; }

// Big headings: per-letter spans, fixed widths, Baybayin + symbols cycling
function decryptName(el, total){
  var text=el.getAttribute("data-name")||el.textContent;
  el.setAttribute("aria-label",text);
  var brk=el.hasAttribute("data-break"); el._decrypting=true;
  function finalMarkup(){ var t=el.getAttribute("data-name")||text; if(brk) el.innerHTML=esc(t).replace(/ /g,"<br>"); else el.textContent=t; }
  if(reduceMotion){ finalMarkup(); return {cancel:function(){}}; }
  el.innerHTML="";
  var spans=[], word=null;
  for(var i=0;i<text.length;i++){
    var s=document.createElement("span"); s.className="ch"; s.setAttribute("aria-hidden","true");
    if(text[i]===" " && brk){ s.className="ch br"; s.textContent=""; }
    else if(text[i]===" "){ s.className="ch sp"; s.textContent=" "; }   // a real space: shows the gap, allows wrapping
    else s.textContent=text[i];
    // keep each word together so multi-word titles wrap between words, never inside one
    if(text[i]===" "){ el.appendChild(s); word=null; }
    else { if(!word){ word=document.createElement("span"); word.className="wd"; el.appendChild(word); } word.appendChild(s); }
    spans.push(s);
  }
  // lock widths to the final glyphs so the word never jitters
  spans.forEach(function(s){ if(!/\b(br|sp)\b/.test(s.className)) s.style.width=s.getBoundingClientRect().width+"px"; });
  var n=text.length, start=performance.now(), locks=[];
  for(var j=0;j<n;j++){ locks.push(total*.28 + (total*.66)*(j/Math.max(1,n-1)) + Math.random()*total*.06); }
  var last=0, raf, done=false;
  function frame(now){
    var t=now-start;
    if(now-last>70){ // slow, readable flicker
      last=now;
      for(var k=0;k<n;k++){
        if(text[k]===" ") continue;
        if(t>=locks[k]){ if(!spans[k]._on){ spans[k].textContent=text[k]; spans[k].className="ch on"; spans[k]._on=true; } }
        else { spans[k].innerHTML = bayGlyph(BAY[Math.floor(Math.random()*BAY.length)]); spans[k].className="ch off"; }
      }
    }
    if(t<total+80) raf=requestAnimationFrame(frame); else finish();
  }
  function finish(){ if(done) return; done=true; finalMarkup(); el._decrypting=false; if(typeof glitchBurst==="function") setTimeout(function(){ glitchBurst(el); },120); }
  raf=requestAnimationFrame(frame);
  return {cancel:function(){ cancelAnimationFrame(raf); finish(); }};
}

// Body text: walk text nodes, sweep left-to-right
function decryptBlock(el, total, delay){
  var nodes=[]; var w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  var nd; while((nd=w.nextNode())){ if(nd.nodeValue.trim()) nodes.push(nd); }
  nodes.forEach(function(x){ if(x._orig==null) x._orig=x.nodeValue; x.nodeValue=x._orig; });
  if(reduceMotion || !nodes.length) return {cancel:function(){}};
  var full=nodes.map(function(x){return x._orig;}), len=full.reduce(function(a,b){return a+b.length;},0);
  var start=performance.now()+delay, last=0, raf, done=false;
  el.setAttribute("aria-busy","true");
  function render(progress){
    var revealed=Math.floor(progress*len), idx=0;
    nodes.forEach(function(x,ni){
      var o=full[ni], s="";
      for(var c=0;c<o.length;c++,idx++){
        if(idx<revealed) s+=o[c];
        else if(idx<revealed+18 || progress<=0) s+=scrambleFor(o[c]);
        else s+=scrambleFor(o[c]);
      }
      x.nodeValue=s;
    });
  }
  function frame(now){
    var t=now-start;
    if(now-last>55){ last=now; var p=Math.max(0,Math.min(1,t/total)); p=p<1? (1-Math.pow(1-p,1.6)):1; render(p); }
    if(t<total) raf=requestAnimationFrame(frame); else finish();
  }
  function finish(){ if(done) return; done=true; nodes.forEach(function(x){x.nodeValue=x._orig;}); el.removeAttribute("aria-busy"); }
  render(0);
  raf=requestAnimationFrame(frame);
  return {cancel:function(){ cancelAnimationFrame(raf); finish(); }};
}

function runPage(page){
  cancelRuns();
  var name=$("[data-name]",page);
  var nameMs = page.id==="page-home"? CONFIG.nameDecryptMs : CONFIG.titleDecryptMs;
  if(name) runs.push(decryptName(name,nameMs));
  var blocks=$all("[data-decrypt]",page).filter(function(b){ return b.offsetParent!==null; });
  blocks.forEach(function(b,i){ runs.push(decryptBlock(b, CONFIG.bodyDecryptMs, 350+Math.min(i,10)*110)); });
  var st=$("[data-status]",page);
  if(st){
    // "IDENTITY // DECRYPTING" with dots stepping  · . .. ...  twice, then "THE HACKER POET" decrypts in
    // read when shown, so text published from admin.html wins even if it arrives mid-animation
    function FINAL_(){ var id=st.getAttribute("data-identity")||"The Hacker Poet"; st.setAttribute("aria-label","Identity: "+id);
      return esc(st.getAttribute("data-status-label")||"identity")+' // <span class="ok" data-edit="home.identity" data-type="plain">'+esc(id)+'</span>'; }
    var FINAL=FINAL_();
    if(reduceMotion){ st.innerHTML=FINAL; }
    else{
      st.innerHTML=esc(st.getAttribute("data-status-label")||"identity")+' // decrypting<span class="dots" aria-hidden="true"></span>';
      var dots=st.querySelector(".dots"), step=0, DOT_MS=380, STEPS=8;   // 2 full sequences of 4
      var iv=setInterval(function(){
        step++;
        if(step<STEPS){ dots.textContent=".".repeat(step%4); return; }
        clearInterval(iv);
        st.innerHTML=FINAL_();
        runs.push(decryptBlock(st.querySelector(".ok"),1500,0));
      },DOT_MS);
      runs.push({cancel:function(){ clearInterval(iv); st.innerHTML=FINAL_(); }});
    }
  }
}

/* ============================================================
   Laptop screen: tokens typed line by line like a terminal session.
   Drawn as tiny colored bars (they read as code at this size). Lives
   inside the boat symbol, so the lake reflection types along with it.
   ============================================================ */
(function(){
  var g=document.getElementById("codeLines"); if(!g) return;
  var hA=document.getElementById("handA"), hB=document.getElementById("handB");
  var NS="http://www.w3.org/2000/svg", LH=10.5, MAX=9;

  function r(a,b){return a+Math.random()*(b-a);}

    var t=[], x=6, kind=Math.random();
    function add(w,c){ if(x+w>94) return false; t.push({x:x,w:w,c:c}); x+=w+2.4; return true; }
    if(kind<.22){ add(4,C.red); add(r(10,16),C.cream); add(r(14,30),C.dim); }           // $ cmd --flags
    else if(kind<.34){ add(r(30,80),C.dim); }                                             // output
    else if(kind<.42){ add(6,C.gold); add(r(20,60),C.red); }                              // [ok] ████
    else { x+= [0,6,12,18][Math.floor(r(0,4))];                                            // source code
      var n=Math.floor(r(2,6)), cs=[C.red,C.cream,C.cream,C.gold,C.dim];
      for(var i=0;i<n;i++){ if(!add(r(4,17),cs[Math.floor(r(0,cs.length))])) break; } }
    return {t:t,shown:0};
  }
  var lines=[line()], cursorOn=true, hand=0;
  function draw(){
    while(g.firstChild) g.removeChild(g.firstChild);
    lines.forEach(function(L,i){
      var y=5+i*LH;
      for(var j=0;j<L.shown;j++){ var k=L.t[j]; var e=document.createElementNS(NS,"rect");
        e.setAttribute("x",k.x); e.setAttribute("y",y); e.setAttribute("width",k.w); e.setAttribute("height",5.6);
        e.setAttribute("rx",1); e.setAttribute("fill",k.c); g.appendChild(e); }

   Firestore layout:  site_pages/{home|about|projects|blog|contact|global}  ->  { fields: { "page.key": "<html or text>" } }
   Everything coming from the database is passed through sanitize() before it touches the page.
   ============================================================ */
// Public web config: safe to ship in the page. Security comes from the Firestore rules (see instructions.html).

var CONTENT_DOCS = ["home","about","projects","events","contact","global"];
function docOfKey(k){ var p=String(k).split(".")[0]; return p==="footer" ? "global" : p; }

/* ---------- sanitizer: whitelist of tags and attributes ----------
   mode "plain"  -> text only
   mode "inline" -> bold/italic/underline/strike/size/links/line breaks
   mode "rich"   -> inline + paragraphs, bullet and numbered lists, indents
   mode "list"   -> rich + the structural markup the repeating lists use        */
var SAN_LEVEL = {B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,SUB:1,SUP:1,CODE:1,A:1,SPAN:1,BR:1,FONT:1,
                 P:2,DIV:2,UL:2,OL:2,LI:2,BLOCKQUOTE:2,H3:2,H4:2,
                 DL:3,DT:3,DD:3};
var SAN_DROP = /^(SCRIPT|STYLE|IFRAME|FRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|NOSCRIPT|LINK|META|BASE|FORM|INPUT|TEXTAREA|SELECT|BUTTON|IMG|PICTURE|VIDEO|AUDIO|SOURCE|CANVAS|TITLE|HEAD)$/;
var SAN_DATA = {"data-tags":1,"data-bay":1,"data-decrypt":1,"data-part":1,"data-type":1,"data-stack":1};
var SAN_ARIA = {"aria-expanded":1,"aria-controls":1,"aria-hidden":1,"aria-labelledby":1,"aria-label":1};
function sanitize(html, mode){
  var src = new DOMParser().parseFromString("<!doctype html><body>"+String(html==null?"":html)+"</body>","text/html").body;
  if(mode==="plain") return (src.textContent||"").replace(/\s+/g," ").trim();
  var out = document.createElement("div");
  (function walk(from, to){
    Array.prototype.forEach.call(from.childNodes, function(n){
      if(n.nodeType===3){ to.appendChild(document.createTextNode(n.nodeValue)); return; }
      if(n.nodeType!==1) return;
      var tag = n.tagName.toUpperCase();
      if(SAN_DROP.test(tag)) return;
      var lvl = SAN_LEVEL[tag];
      var ok = lvl===1 || (lvl===2 && mode!=="inline") || (lvl===3 && mode==="list");
      if(!ok){ walk(n,to); if(lvl===2 && mode==="inline" && to.lastChild && to.lastChild.nodeType===3) to.appendChild(document.createTextNode(" ")); return; }
      var name = tag==="FONT" ? "span" : (tag==="STRIKE"||tag==="DEL") ? "s" : tag.toLowerCase();
      var el = document.createElement(name), cls = [];
      Array.prototype.forEach.call(n.attributes, function(a){
        var k = a.name.toLowerCase(), v = String(a.value);
        if(k==="class"){ v.split(/\s+/).forEach(function(c){ if(/^[a-z][a-z0-9-]{0,40}$/.test(c)) cls.push(c); }); }
        else if(k==="size" && tag==="FONT"){ var z=parseInt(v,10); if(z>=1&&z<=7) cls.push("fs-"+z); }
        else if(k==="href" && tag==="A"){ v=v.trim(); if(/^(https?:\/\/|mailto:)[^\s<>"'`]+$/i.test(v) || /^#[a-z0-9-]*$/i.test(v)) el.setAttribute("href",v); }
        else if(k==="data-link"){ v=v.trim(); if(/^(https?:\/\/|mailto:)[^\s<>"'`]+$/i.test(v) || /^#[a-z0-9-]*$/i.test(v)) el.setAttribute("data-link",v.slice(0,500)); }
        else if(SAN_DATA[k] || SAN_ARIA[k]){ el.setAttribute(k, v.replace(/[<>"'`]/g,"").slice(0,200)); }
        else if(k==="id" && /^[a-z][a-z0-9-]{0,40}$/.test(v)) el.setAttribute("id",v);
        else if(k==="role" && /^(region|button|link)$/.test(v)) el.setAttribute("role",v);
        else if(k==="tabindex" && v==="0") el.setAttribute("tabindex","0");
        else if(k==="hidden") el.setAttribute("hidden","");
        else if(k==="lang" && /^[a-z]{2,3}$/.test(v)) el.setAttribute("lang",v);
      });
      if(cls.length) el.setAttribute("class", cls.join(" "));
      if(name==="a" && /^https?:/i.test(el.getAttribute("href")||"")){ el.setAttribute("target","_blank"); el.setAttribute("rel","noopener noreferrer"); }
      if(!el.hasAttribute("data-bay")) walk(n, el);   // Baybayin glyph holders are redrawn, never stored
      to.appendChild(el);
    });
  })(src, out);
  return out.innerHTML;
}

function elOfKey(key){
  return document.querySelector('[data-list="'+key+'"]') || document.querySelector('[data-edit="'+key+'"]');
}
// put one saved value into the page
function applyField(key, val){
  if(typeof val!=="string") return;
  var list = document.querySelector('[data-list="'+key+'"]');
  if(list){ list.innerHTML = sanitize(val,"list"); renderBay(list); linkify(list); if(list.id==="posts") fixPosts(); return; }
  if(key==="home.identity"){
    var st=$("[data-status]"); if(!st) return;
    st.setAttribute("data-identity", sanitize(val,"plain") || "The Hacker Poet");
    st.setAttribute("aria-label","Identity: "+st.getAttribute("data-identity"));
    var ok=st.querySelector(".ok"); if(ok) ok.textContent=st.getAttribute("data-identity");
    return;
  }
  if(key==="contact.github" || key==="contact.linkedin"){
    var u = sanitize(val,"plain").replace(/\s+/g,"");
    if(u && !/^https?:\/\//i.test(u)) u = "https://"+u;
    if(u && !/^https:\/\/[^\s<>"'`]+$/i.test(u)) return;
    CONFIG[key.split(".")[1]] = u; renderAddr(); return;
  }
  var el = document.querySelector('[data-edit="'+key+'"]'); if(!el) return;
  var type = el.getAttribute("data-type") || "rich";
  if(el.hasAttribute("data-name")){
    var t = sanitize(val,"plain"); if(!t) return;
    el.setAttribute("data-name", t);
    var brk = el.hasAttribute("data-break");
    if(el.classList.contains("glitch")) el.setAttribute("data-text", brk ? t.replace(/ /g,"\n") : t);
    if(brk) el.innerHTML = esc(t).replace(/ /g,"<br>"); else el.textContent = t;
    if(el.matches("h1.name")) setTimeout(alignCartouche,0);
    return;
  }
  if(type==="plain") el.textContent = sanitize(val,"plain");
  else el.innerHTML = sanitize(val,type);
}
function applyAll(all){
  if(!all) return;
  Object.keys(all).forEach(function(d){
    var f = all[d] || {};
    Object.keys(f).forEach(function(k){ try{ applyField(k, f[k]); }catch(e){} });
  });
}
// Plain text as typed. innerText is avoided on purpose: it applies CSS text-transform,
// so a field shown in capitals (the name, labels, footer) would be saved in capitals.
function plainText(el){
  var c = el.cloneNode(true);
  $all("br",c).forEach(function(b){ b.parentNode.replaceChild(document.createTextNode("\n"), b); });
  $all("div,p,li",c).forEach(function(b){ b.insertBefore(document.createTextNode("\n"), b.firstChild); });
  return c.textContent;
}
// read the current value of a key back out of the page (used by the editor when saving)
function serialize(key){
  var list = document.querySelector('[data-list="'+key+'"]');
  if(list){
    var c = list.cloneNode(true);
    $all("[data-bay]",c).forEach(function(b){ b.innerHTML=""; });
    if(c.id==="posts") $all(".post-btn",c).forEach(function(b){ b.setAttribute("aria-expanded","false"); });
    // items hidden by a filter chip are view state, not content
    Array.prototype.forEach.call(c.children,function(it){ it.removeAttribute("hidden"); });
    return sanitize(c.innerHTML,"list");
  }
  if(key==="home.identity"){ var st=$("[data-status]"); return st ? (st.getAttribute("data-identity")||"") : null; }
  if(key==="contact.github" || key==="contact.linkedin") return CONFIG[key.split(".")[1]] || "";
  var el = document.querySelector('[data-edit="'+key+'"]'); if(!el) return null;
  if(el.hasAttribute("data-name")) return el.getAttribute("data-name");
  var type = el.getAttribute("data-type") || "rich";
  return type==="plain" ? sanitize(plainText(el),"plain") : sanitize(el.innerHTML,type);
}
// after an in-place edit: clean the element and run any side effects (name attributes, links, glyphs)
function commit(key){
  var list = document.querySelector('[data-list="'+key+'"]');
  if(list){ applyField(key, serialize(key)); return; }
  var el = document.querySelector('[data-edit="'+key+'"]'); if(!el) return;
  var type = el.getAttribute("data-type") || "rich";
  var raw = (type==="plain") ? plainText(el) : el.innerHTML;
  if(key==="home.identity" || key==="contact.github" || key==="contact.linkedin" || el.hasAttribute("data-name")) applyField(key, String(raw).replace(/\s+/g," ").trim());
  else applyField(key, raw);
}
function allKeys(){
  var ks = $all("[data-edit]").map(function(e){ return e.getAttribute("data-edit"); }).concat($all("[data-list]").map(function(e){ return e.getAttribute("data-list"); }));
  ["home.identity","contact.github","contact.linkedin"].forEach(function(k){ if(ks.indexOf(k)<0) ks.push(k); });
  return ks.filter(function(k,i){ return ks.indexOf(k)===i; });
}

// public site: show the last saved copy instantly, then refresh from Firestore
function loadContent(){
  var cached = null;
  cached = null;
  if(cached){ try{ applyAll(cached); }catch(e){} }
  if(!FIREBASE_CONFIG.projectId) return Promise.resolve();
  return Promise.all([ import(FIREBASE_SDK+"firebase-app.js"), import(FIREBASE_SDK+"firebase-firestore-lite.js") ]).then(function(m){
    var appMod=m[0], fs=m[1];
    var app = appMod.getApps().filter(function(a){ return a.name==="bantay-public"; })[0] || appMod.initializeApp(FIREBASE_CONFIG,"bantay-public");
    var db = fs.getFirestore(app);
    return Promise.all(CONTENT_DOCS.map(function(d){
      return fs.getDoc(fs.doc(db,"site_pages",d)).then(function(s){ return s.exists() ? (s.data().fields||{}) : null; }, function(){ return null; });
    }));
  }).then(function(res){
    var all = {}; CONTENT_DOCS.forEach(function(d,i){ if(res[i]) all[d]=res[i]; });
    var js = JSON.stringify(all);
    try{ localStorage.setItem("bantay-content", js); }catch(e){}
    if(!cached || JSON.stringify(cached)!==js) applyAll(all);
  }).catch(function(){ /* offline or blocked: the built-in text stays */ });
}

// wait for live content (up to 1.5s) and web fonts, so the name is measured and decrypted in its final form
(function(){
  var booted=false;
  function go(){ if(!booted){ booted=true; boot(); } }
  var content = EDIT_MODE? Promise.resolve() : Promise.race([loadContent(), new Promise(function(r){ setTimeout(r,1500); })]);
  content.then(function(){ return document.fonts && document.fonts.ready ? document.fonts.ready : null; }).then(go,go);
  setTimeout(go,3000);
})();

/* ============================================================
   Post page: section highlight, code blocks, decrypt-on-scroll, reading bar
   ============================================================ */
(function(){
  var sec=(document.querySelector('meta[name="syslog:section"]')||{}).content||"";
  $all("nav a[data-sec]").forEach(function(a){ if(a.getAttribute("data-sec")===sec) a.setAttribute("aria-current","page"); });

  // --- syntax colouring: small, dependency-free, good enough for KQL / PowerShell / Python / JS / Bash / SQL / JSON
  var KW={
    kql:"let where project project-away project-rename extend summarize by join kind on union take limit top order sort asc desc count distinct ago now contains contains_cs has has_any has_all hasprefix hassuffix startswith endswith in and or not isnotempty isempty isnull isnotnull bin make_set make_list dcount countif sumif parse parse_json mv-expand render datetime timespan tostring toint tolong todouble iff iif case between materialize evaluate invoke lookup as with true false null search find externaldata extract matches regex split strcat",
    powershell:"function param begin process end if else elseif foreach for while do switch return try catch finally throw break continue in -eq -ne -gt -lt -ge -le -like -notlike -match -notmatch -and -or -not -contains -in $true $false $null",
    python:"def class return if elif else for while in not and or is import from as with try except finally raise pass break continue lambda yield None True False async await global nonlocal print",
    js:"const let var function return if else for while do switch case break continue new class extends import export from default try catch finally throw typeof instanceof in of async await null undefined true false this",
    bash:"if then else elif fi for in do done while case esac function return export local echo sudo cd ls grep awk sed cat chmod chown apt pip git curl wget",
    sql:"select from where and or not in is null as join left right inner outer on group by order having limit insert into values update set delete create table index view distinct count sum avg min max union all case when then else end",
    json:"true false null"
  };
  Object.keys(KW).forEach(function(k){ var o={}; KW[k].split(" ").forEach(function(w){ o[w.toLowerCase()]=1; }); KW[k]=o; });
  KW.ps=KW.powershell; KW.py=KW.python; KW.javascript=KW.js; KW.sh=KW.bash; KW.shell=KW.bash;
  function highlight(code, lang){
    lang=(lang||"").toLowerCase(); var kw=KW[lang]; if(!kw) return;
    var src=code.textContent, out="", i=0, n=src.length;
    var lineC = lang==="python"||lang==="py"||lang==="bash"||lang==="sh"||lang==="shell"||lang==="powershell"||lang==="ps" ? "#" : (lang==="sql"? "--" : "//");
    function e(t){ return esc(t); }
    while(i<n){
      var ch=src[i], rest=src.slice(i), m;
      if(rest.indexOf(lineC)===0 && lang!=="json"){ var j=src.indexOf("\n",i); if(j<0) j=n; out+='<span class="tk-c">'+e(src.slice(i,j))+'</span>'; i=j; continue; }
      if(rest.indexOf("/*")===0 && /^(js|javascript|kql|sql)$/.test(lang)){ var j2=src.indexOf("*/",i+2); j2= j2<0? n : j2+2; out+='<span class="tk-c">'+e(src.slice(i,j2))+'</span>'; i=j2; continue; }
      if(ch==='"' || ch==="'" || ch==="`"){ var k=i+1; while(k<n && src[k]!==ch){ if(src[k]==="\\") k++; k++; } k=Math.min(n,k+1); out+='<span class="tk-s">'+e(src.slice(i,k))+'</span>'; i=k; continue; }
      if((m=/^\$[A-Za-z_][\w:]*/.exec(rest)) && (lang==="powershell"||lang==="ps"||lang==="bash"||lang==="sh")){ out+='<span class="tk-v">'+e(m[0])+'</span>'; i+=m[0].length; continue; }
      if((m=/^-?\b\d[\d_.]*(?:[a-z]{1,2}\b)?/i.exec(rest))){ out+='<span class="tk-n">'+e(m[0])+'</span>'; i+=m[0].length; continue; }
      if((m=/^-?[A-Za-z_][\w-]*/.exec(rest))){
        var w=m[0], lw=w.toLowerCase();
        if(kw[lw]) out+='<span class="tk-k">'+e(w)+'</span>';
        else if(src[i+w.length]==="(") out+='<span class="tk-f">'+e(w)+'</span>';
        else out+=e(w);
        i+=w.length; continue;
      }
      out+=e(ch); i++;
    }
    code.innerHTML=out;
  }
  function copyText(text, btn){
    function ok(){ var o=btn.textContent; btn.textContent="Copied"; setTimeout(function(){ btn.textContent=o; },1500); }
    function legacy(){ var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px";
      document.body.appendChild(ta); ta.select(); var good=false; try{ good=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); if(good) ok(); else btn.textContent="Press Ctrl/⌘+C"; }
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok,legacy); else legacy();
  }
  $all("figure.code").forEach(function(f){
    var code=$("code",f); if(!code) return;
    var raw=code.textContent; highlight(code, f.getAttribute("data-lang"));
    var b=$(".copy-btn",f); if(b) b.addEventListener("click",function(){ copyText(raw,b); });
  });

  // --- paragraphs decrypt as they scroll into view (the title and lead decrypt on load)
  var blocks=$all(".article-body [data-decrypt-io]");
  if(!reduceMotion && window.IntersectionObserver){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return; io.unobserve(en.target);
        var len=(en.target.textContent||"").length;
        decryptBlock(en.target, Math.max(700, Math.min(1900, 500+len*4)), 0);
      });
    },{rootMargin:"0px 0px -12% 0px", threshold:.12});
    blocks.forEach(function(b){ io.observe(b); });
  }

  // --- reading progress, drawn inside the top bar
  var bar=document.createElement("div"); bar.className="read-bar"; bar.setAttribute("aria-hidden","true");
  var top=document.getElementById("topbar"); if(top) top.appendChild(bar);
  var art=$(".article");
  function prog(){ if(!art) return; var r=art.getBoundingClientRect(), h=r.height-innerHeight*.6;
    var p= h>0 ? Math.min(1,Math.max(0,(-r.top+innerHeight*.25)/h)) : 1; bar.style.width=(p*100).toFixed(1)+"%"; }
  addEventListener("scroll",prog,{passive:true}); addEventListener("resize",prog); prog();
})();

})();
